services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: betfair-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_USER: betfair
      POSTGRES_PASSWORD: betfair
      POSTGRES_DB: betfair
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - timescale-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U betfair -d betfair"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  timescale-data:
